# 迪礼 ERP 反向代理（生产边缘 nginx）—— 仓库里的**唯一**一份，由 scripts/deploy/remote-nginx.sh 安装。
#
# 为什么这份配置要进仓库（2026-11-12）：
#   它以前只存在于服务器 /etc/nginx/sites-available/dilee（来源是 .deploy-run-118/16-nginx.sh，
#   而 .deploy-run*/ 被 .gitignore 排除）。结果是「边缘」这一层没人管、没人测、没有版本，
#   一台机器的配置对不对，只能在出事之后上机 cat 才知道。
#
# 翻过的车（本文件的来历）：
#   nginx 的 client_max_body_size **默认是 1m**，而这里一直没写。销售单 Excel 补录传一份
#   1.5MB 的 .xls 时，nginx 在**转发之前**就返回 413（HTML 错误页），请求根本没到 API
#   —— API 日志里一条记录都没有，界面只显示一句「读取失败」。
#   见 docs/design/sales-order-import-upload-failed-2026-11-12.md。
#
# 这里的上限必须 >= 应用自己的上传上限（Multer `limits.fileSize` = 10MB，
# 见 apps/api/src/modules/sales/*/**.controller.ts 与 apps/web/lib/*-import.ts 的同名常量）。
# 取 20m 是给 multipart 边界与头部留的余量：**边缘只能比应用宽，不能比应用窄**，
# 否则「应用说支持 10MB、网关 1MB 就掐掉」，用户看到的永远是那句看不出原因的失败。
# 改了这里的数，必须同时改 scripts/deploy/remote-nginx.sh 里的探针体积（PROBE_BYTES）。
#
# 口径（用户 2026-11-12 明确）：**单文件上限 10MB**。这个 10MB 是产品承诺，
# 应用侧（Multer / 前端常量）就是它；边缘的 20m 只是「不许比应用窄」的护栏，不是另一个业务上限。
# 所以 remote-nginx.sh 的探针体积直接顶到 10MB：真传一个 10MB 的文件能过，
# 「单文件 10MB」才算数 —— 探针只传 2MB 的话，把边缘悄悄调回 5m 也照样绿。

server {
    listen 80;
    listen [::]:80;
    server_name 118.178.95.156;

    # 上传体积上限（见文件头：不写 = 1m = 413；产品口径是单文件 10MB）。
    client_max_body_size 20m;

    # 上传/解析类请求偶发超过 nginx 默认的 60s 读超时（大 Excel + 带图 BIFF），
    # 超时会被 nginx 记成 504 并让前端看到「读取失败」，所以给到 120s。
    client_body_timeout 120s;
    send_timeout 120s;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
