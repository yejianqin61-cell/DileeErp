name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/yejianqin61-cell/dilee-api
  WEB_IMAGE: ghcr.io/yejianqin61-cell/dilee-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run build --workspace=@dilee/api
      - run: npm run build --workspace=@dilee/web

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: API_INTERNAL_URL=http://api:3001
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload compose definition
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.factory.yml \
            ubuntu@"$DEPLOY_HOST":/opt/dilee/app/docker-compose.factory.yml
      - name: Upload images and deploy containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "Pulling API image..."
          docker pull "$API_IMAGE:${{ github.sha }}"
          echo "Pulling Web image..."
          docker pull "$WEB_IMAGE:${{ github.sha }}"
          echo "Streaming images to server..."
          timeout 20m docker save "$API_IMAGE:${{ github.sha }}" "$WEB_IMAGE:${{ github.sha }}" \
            | gzip -1 \
            | timeout 20m ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
                -i ~/.ssh/deploy_key ubuntu@"$DEPLOY_HOST" 'gunzip | sudo docker load'
          echo "Images loaded; starting containers..."
          ssh -i ~/.ssh/deploy_key ubuntu@"$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/dilee/app
          sudo env \
            API_IMAGE=ghcr.io/yejianqin61-cell/dilee-api:${{ github.sha }} \
            WEB_IMAGE=ghcr.io/yejianqin61-cell/dilee-web:${{ github.sha }} \
            docker compose -f docker-compose.factory.yml --env-file .env.factory up -d --no-build --force-recreate api web
          sudo docker compose -f docker-compose.factory.yml --env-file .env.factory ps
          sudo docker exec app-api-1 node -e "fetch('http://127.0.0.1:3001/api/v1/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
          REMOTE
